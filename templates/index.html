<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventDate - Find Events & Meet People</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .event-card {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background: white;
        }
        .event-list {
            max-width: 800px;
            margin: 0 auto;
        }
        .btn-rsvp {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container event-list">
        <h1 class="text-center mb-4">EventDate</h1>
        <p class="text-center">Find events and meet people attending the same event!</p>
        
        <div id="events">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading events...</p>
            </div>
        </div>
    </div>

    <script>
        // Fetch and display events
        fetch('/api/events')
            .then(response => response.json())
            .then(data => {
                const eventsList = document.getElementById('events');
                eventsList.innerHTML = '';
                
                if (data.length === 0) {
                    eventsList.innerHTML = '<p class="text-center">No events found. Be the first to post one!</p>';
                    return;
                }
                
                data.forEach(event => {
                    const eventCard = document.createElement('div');
                    eventCard.className = 'event-card';
                    eventCard.innerHTML = `
                        <h3>${event.title}</h3>
                        <p><strong>Location:</strong> ${event.location}</p>
                        <p><strong>Date:</strong> ${event.date}</p>
                        <p>${event.description}</p>
                        <p><strong>Organizer:</strong> ${event.organizer}</p>
                        <button class="btn btn-rsvp" onclick="rsvp(${event.id})">RSVP</button>
                    `;
                    eventsList.appendChild(eventCard);
                });
            })
            .catch(error => {
                document.getElementById('events').innerHTML =
                    '<p class="text-center text-danger">Failed to load events. Please try again later.</p>';
            });
        
        // RSVP function
        function rsvp(eventId) {
            alert(`You RSVP'd to event #${eventId}!`);
            // In a real app, send a POST request to /api/rsvp
        }
    </script>
</body>
</html>
